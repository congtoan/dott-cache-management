###################################################################################################
# rocket-page-cache.conf: nginx phục vụ thẳng file cache WP Rocket, không qua PHP.
#
# Dựa trên rocket-nginx 3.0.2 (/etc/nginx/rocket-nginx/conf.d/default.conf, MIT, SatelliteWP).
# Chỉ giữ phần PAGE CACHE. Khác bản gốc:
#   - BỎ các block CSS/JS/media: header cache của chúng do /etc/nginx/extra/staticfiles.conf lo
#     (1 năm, immutable). Bản gốc đặt 30d và sẽ đè lên.
#   - BỎ quy tắc "client nhận br thì dùng .html": nginx này không có brotli. Cloudflare gửi
#     "Accept-Encoding: gzip, br" tới origin, nên bản gốc sẽ trả .html rồi nginx tự nén lại.
#     Ở đây: nhận gzip thì trả thẳng _gzip.
#   - Location đặt là "^~ /wp-content/cache/wp-rocket/" (prefix dài hơn /wp-content/cache trong
#     wordpress_secure.conf). Lý do: location lồng ".html$" ở đó đặt expires 365d. Nếu nó bắt được
#     file HTML thì trang sẽ bị cache 1 năm ở trình duyệt và Cloudflare.
#   - Không thêm Cache-Control cho HTML, giữ đúng như khi advanced-cache.php trả (không có header này).
#   - Thêm điều kiện bỏ qua theo User-Agent: giống $rocket_cache_reject_ua của WP Rocket.
#   - Header kiểm tra: X-Rocket-Nginx-Serving-Static (HIT | MISS | BYPASS).
#
# Cài: include file này trong server {} cổng 443, TRƯỚC "include /etc/nginx/rewrite/wordpress.conf;"
# Repo: dott-cache-management/deploy/nginx/rocket-page-cache.conf (nhánh v2).
###################################################################################################

set $rocket_bypass          1;
set $rocket_encryption      "";
set $rocket_is_bypassed     "MISS";
set $rocket_https_prefix    "";
set $rocket_is_https        0;

set $rocket_is_args $is_args;

set $rocket_uri_path "";
if ($request_uri ~ "^([^?]*)(\?.*)?$") {
	set $rocket_uri_path $1;
}

if ($http_accept_encoding ~ gzip) {
	set $rocket_encryption "_gzip";
}

if ($https = "on") { set $rocket_is_https 1; }
if ($http_x_forwarded_proto = "https") { set $rocket_is_https 1; }
if ($rocket_is_https = "1") {
	set $rocket_https_prefix "-https";
}

# WP Rocket tách cache mobile thì tạo file .mobile-active trong thư mục URL. nginx không tự chọn
# bản mobile được nên để PHP (advanced-cache.php) xử lý như cũ.
set $rocket_mobile_detection "$document_root/wp-content/cache/wp-rocket/$http_host/$rocket_uri_path/.mobile-active";

# Tham số theo dõi quảng cáo: bỏ qua, giống WP Rocket ($rocket_cache_ignored_parameters)
set $rocket_args $args;
if ($rocket_args ~ (.*)(?:&|^)utm_source=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_campaign=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_medium=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_expid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_term=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_content=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)utm_id=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)_ga=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)gclid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)gbraid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)wbraid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)fbclid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ (.*)(?:&|^)msclkid=[^&]*(.*)) { set $rocket_args $1$2; }
if ($rocket_args ~ ^&(.*)) { set $rocket_args $1; }
if ($rocket_args = "") {
	set $rocket_is_args "";
}

set $rocket_url  "/wp-content/cache/wp-rocket/$http_host/$rocket_uri_path/index$rocket_https_prefix.html";
set $rocket_file "$document_root/wp-content/cache/wp-rocket/$http_host/$rocket_uri_path/index$rocket_https_prefix.html";

if (-f "$rocket_file$rocket_encryption") {
	set $rocket_file "$rocket_file$rocket_encryption";
	set $rocket_url  "$rocket_url$rocket_encryption";
}
if (!-f "$rocket_file") {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "MISS";
}
if ($request_method != GET) {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
if ($rocket_is_args) {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
if (-f "$document_root/.maintenance") {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
# Giống $rocket_cache_reject_cookies của WP Rocket (+ giỏ hàng)
if ($http_cookie ~* "(wordpress_logged_in_|wp-postpass_|wptouch_switch_toggle|comment_author_|comment_author_email_|woocommerce_items_in_cart|edd_items_in_cart)") {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
# Giống $rocket_cache_reject_ua của WP Rocket
if ($http_user_agent ~* "(facebookexternalhit|WhatsApp)") {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
if (-f "$rocket_mobile_detection") {
	set $rocket_bypass 0;
	set $rocket_is_bypassed "BYPASS";
}
if ($rocket_bypass = 1) {
	set $rocket_is_bypassed "HIT";
	rewrite .* "$rocket_url" last;
}

location ^~ /wp-content/cache/wp-rocket/ {
	location ~ \.html$ {
		charset utf-8;
		etag on;
		add_header Vary "Accept-Encoding, Cookie";
		add_header X-Rocket-Nginx-Serving-Static $rocket_is_bypassed;
	}
	location ~ _gzip$ {
		etag on;
		gzip off;
		types {}
		default_type "text/html; charset=utf-8";
		add_header Content-Encoding gzip;
		add_header Vary "Accept-Encoding, Cookie";
		add_header X-Rocket-Nginx-Serving-Static $rocket_is_bypassed;
	}
	location ~ \.php$ { deny all; access_log off; log_not_found off; }
}

# Request không được phục vụ tĩnh vẫn mang header để kiểm tra (MISS | BYPASS)
add_header X-Rocket-Nginx-Serving-Static $rocket_is_bypassed;
